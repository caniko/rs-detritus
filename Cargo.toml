[workspace]
members = [
    "crates/detritus-client",
    "crates/detritus-protocol",
    "crates/detritus-server",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://codeberg.org/caniko/rs-detritus"
homepage = "https://codeberg.org/caniko/rs-detritus"
rust-version = "1.85"
authors = ["Can H. Tartanoglu <gpg@rotas.mozmail.com>"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
future_incompatible = { level = "warn", priority = -1 }
unreachable_pub = "warn"
# Mixed lib/bin packages use dependencies through different crate targets, which
# makes this rustc lint noisy under `--workspace --all-targets`.
unused_crate_dependencies = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
result_large_err = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"
# These pedantic/nursery lints are noisy for generated code, builder APIs,
# private-module visibility, counters, and lock lifetimes in this workspace.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
or_fun_call = "allow"
redundant_pub_crate = "allow"
return_self_not_must_use = "allow"
significant_drop_tightening = "allow"
suboptimal_flops = "allow"
trivially_copy_pass_by_ref = "allow"

[workspace.dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13.3", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter"] }
uuid = { version = "1.10", features = ["v4"] }
zstd = "0.13"
