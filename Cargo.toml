[workspace]
members = [
    "crates/detritus-client",
    "crates/detritus-protocol",
    "crates/detritus-server",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://codeberg.org/can/detritus"

[workspace.lints.rust]

[workspace.dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13.3", default-features = false }
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter"] }
uuid = { version = "1.10", features = ["v4"] }
