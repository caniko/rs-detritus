[ci]
runner = "ubuntu-24.04"
runtime = "nix"
step_runners = { cargo-clippy = "ubuntu-24.04", cargo-doc = "ubuntu-24.04", cargo-fmt = "ubuntu-24.04", cargo-package = "ubuntu-24.04", cargo-test = "ubuntu-24.04", nix-check = "ubuntu-24.04", quality-tools = "ubuntu-24.04" }
platform = "github"
publish_crates = true
provider = "actions"
extra_env = { CARGO_BUILD_JOBS = "4", RUSTDOCFLAGS = "-D warnings" }
workspace = true
workspace_strategy = "aggregate"
with_msrv = true
with_audit = true
with_deny = true
with_docs = true
publish_strategy = "coordinated"
required_secrets = ["CRATES_IO_API_TOKEN"]
required_gates = [
  { id = "coverage", run = "nix develop -c bash scripts/coverage.sh", timeout_minutes = 60, env = { CARGO_BUILD_JOBS = "4" } },
]

[ci.pages]
repo = "caniko/rs-detritus"
canonical_domain = "detritus.tartanoglu.com"

[release.github]
repo = "caniko/rs-detritus"
target_branch = "trunk"

# Prebuilt `detritusd` archives for `cargo binstall detritus-server`, built per
# release system from the flake's `mkBinstallRelease` bundle. `keys/minisign.pub`
# verifies the minisign-signed SHA256SUMS.txt manifest.
[release.artifacts]
runner = "ubuntu-24.04"
prebuild_binaries = true
binstall = true
sign = true
system_runners = { x86_64-linux = "ubuntu-24.04", aarch64-darwin = "macos-15" }
