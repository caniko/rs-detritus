[package]
name = "detritus-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Client SDK for Detritus telemetry and crash reporting"
keywords = ["observability", "tracing-subscriber", "crash-reporting", "panic-hook", "telemetry"]
categories = ["development-tools", "network-programming"]
readme = "README.md"
documentation = "https://docs.rs/detritus-client"
include = [
    "Cargo.toml",
    "LICENSE",
    "README.md",
    "examples/**",
    "src/**",
    "tests/**",
]

[features]
default = ["minidump"]
minidump = ["dep:minidumper-child"]

[lib]
name = "detritus"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
detritus-protocol = { path = "../detritus-protocol", version = "0.1.0", features = ["multipart"] }

chrono = { workspace = true, features = ["serde"] }
flate2 = "1"
fs2 = "0.4"
parking_lot = "0.12"
prost = "0.13"
reqwest = { workspace = true, features = ["multipart", "stream", "gzip"] }
rustls = { workspace = true }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
thiserror = { workspace = true }
zstd = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
tonic = "0.13"
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
url = "2"
uuid = { workspace = true, features = ["serde"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
minidumper-child = { version = "0.3", optional = true }

[dev-dependencies]
argon2 = "0.5"
detritus-server = { path = "../detritus-server", version = "0.1.0" }
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
