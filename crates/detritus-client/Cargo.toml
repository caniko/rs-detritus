[package]
name = "detritus-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["minidump"]
minidump = ["dep:minidumper-child"]

[lib]
name = "detritus"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
detritus-protocol = { path = "../detritus-protocol", features = ["multipart"] }

chrono = { workspace = true, features = ["serde"] }
flate2 = "1"
fs2 = "0.4"
parking_lot = "0.12"
prost = "0.13"
reqwest = { version = "0.13.3", default-features = false, features = ["multipart", "stream", "gzip", "http2"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
tonic = "0.13"
tracing = "0.1"
tracing-core = "0.1"
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
url = "2"
uuid = { workspace = true, features = ["serde"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
minidumper-child = { version = "0.3", optional = true }

[dev-dependencies]
argon2 = "0.5"
detritus-server = { path = "../detritus-server" }
tempfile = "3"
