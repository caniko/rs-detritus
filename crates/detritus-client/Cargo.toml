[package]
name = "detritus-client"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Client SDK for Detritus telemetry and crash reporting"
keywords = [
  "observability",
  "tracing-subscriber",
  "crash-reporting",
  "panic-hook",
  "telemetry",
]
categories = ["development-tools", "network-programming"]
readme = "README.md"
documentation = "https://docs.rs/detritus-client"
include = [
  "Cargo.toml",
  "LICENSE",
  "README.md",
  "examples/**",
  "src/**",
  "tests/**",
]

[features]
default = ["minidump"]
minidump = ["dep:minidumper-child", "dep:parking_lot"]

[lib]
name = "detritus"
path = "src/lib.rs"

[[test]]
name = "native_minidump"
harness = false
required-features = ["minidump"]

[lints]
workspace = true

[dependencies]
detritus-protocol = { path = "../detritus-protocol", version = "0.2.0", features = [
  "multipart",
] }

chrono = { workspace = true, features = ["serde"] }
flate2 = "1.1.10"
fs2 = "0.4.3"
prost = { workspace = true }
reqwest = { workspace = true, features = [
  "multipart",
  "stream",
  "gzip",
  "zstd",
] }
rustls = { workspace = true }
secrecy = "0.10.3"
serde = { workspace = true }
serde_json = { workspace = true }
tar = "0.4.46"
thiserror = { workspace = true }
zstd = { workspace = true }
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "fs",
  "sync",
  "time",
] }
tonic = { workspace = true, features = [
  "gzip",
  "zstd",
  "tls-aws-lc",
  "tls-native-roots",
] }
tracing = { workspace = true }
tracing-core = "0.1.36"
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
url = "2.5.8"
uuid = { workspace = true, features = ["serde"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
minidumper-child = { version = "0.5.0", optional = true }
parking_lot = { version = "0.12.5", optional = true }

[dev-dependencies]
detritus-server = { path = "../detritus-server", version = "0.2.0" }
tempfile = "3.27.0"
tokio-rustls = { version = "0.26.6", default-features = false, features = [
  "aws_lc_rs",
] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
