[package]
name = "detritus-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "detritusd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
detritus-protocol = { path = "../detritus-protocol", features = ["multipart"] }

axum = { version = "0.8", features = ["multipart", "http2"] }
argon2 = "0.5"
bytes = "1"
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true }
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
multer = "3"
prometheus = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal", "sync", "io-util", "net", "time"] }
tonic = "0.13"
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip", "decompression-gzip", "trace", "limit"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }
toml = "0.9"
uuid = { workspace = true }

[dev-dependencies]
filetime = "0.2"
reqwest = { workspace = true, features = ["json", "multipart", "http2"] }
tempfile = "3"
