[package]
name = "detritus-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Detritus telemetry and crash ingestion server"
keywords = ["observability", "otlp", "crash-reporting", "server", "telemetry"]
categories = [
  "command-line-utilities",
  "web-programming",
  "network-programming",
]
readme = "README.md"
documentation = "https://docs.rs/detritus-server"
include = [
  "Cargo.toml",
  "LICENSE",
  "README.md",
  "examples/**",
  "src/**",
  "tests/**",
]

[[bin]]
name = "detritusd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
detritus-protocol = { path = "../detritus-protocol", version = "0.1.0", features = [
  "multipart",
] }

axum = { version = "0.8.9", features = ["multipart", "http2"] }
argon2 = { workspace = true }
bytes = "1.12.1"
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true }
futures-util = "0.3.34"
hex = "0.4.3"
jsonschema = { version = "0.58.3", default-features = false }
http-body-util = "0.1.5"
multer = "3.1.0"
prometheus = "0.14.0"
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "fs",
  "signal",
  "sync",
  "io-util",
  "net",
  "time",
] }
tonic = { workspace = true }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = [
  "compression-gzip",
  "decompression-gzip",
  "trace",
  "limit",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
  "env-filter",
  "fmt",
  "json",
] }
toml = "1.1.6"
uuid = { workspace = true }

[dev-dependencies]
filetime = "0.2.29"
reqwest = { workspace = true, features = ["json", "multipart"] }
tempfile = "3.27.0"
zstd = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
