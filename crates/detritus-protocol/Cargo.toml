[package]
name = "detritus-protocol"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Wire protocol types for Detritus telemetry and crash ingestion"
keywords = ["observability", "otlp", "telemetry", "crash-reporting", "protocol"]
categories = ["network-programming", "encoding"]
readme = "README.md"
documentation = "https://docs.rs/detritus-protocol"
include = [
  "Cargo.toml",
  "LICENSE",
  "README.md",
  "build.rs",
  "examples/**",
  "proto/**",
  "src/**",
  "tests/**",
]

[features]
default = ["multipart"]
multipart = ["dep:bytes", "dep:futures-util", "dep:multer", "dep:tokio"]

[lints]
workspace = true

[dependencies]
bytes = { version = "1.12.1", optional = true }
chrono = { workspace = true, features = ["serde"] }
futures-util = { version = "0.3.34", optional = true }
multer = { version = "3.1.0", optional = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util"], optional = true }
tonic = { workspace = true }
tonic-prost = "0.14.6"
uuid = { workspace = true, features = ["serde"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[[example]]
name = "crash_envelope"
required-features = ["multipart"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
