# Generated by simit. Manual edits will be reported as ci=drift.
# Enroll only after moving CRATES_IO_API_TOKEN into the literal environment below,
# restricting it to the exact protected default branch, and qualifying the engine revision.
# Tag-controlled workflows must have no repository/org publishing credential.
# Recovery: rerun the original signed-tag run; matching immutable archives remain reusable.
name: Trusted Crate Publisher

on:
  workflow_run:
    workflows: ["Build Workspace Crates"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: simit-crates-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  verify-detritus-protocol:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Require independently qualified publisher engine
        env:
          PUBLISHER_REVISION: ${{ vars.SIMIT_PUBLISHER_REVISION }}
        run: |
          set -euo pipefail
          [[ "$PUBLISHER_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Enroll a qualified immutable Simit publisher revision' >&2; exit 1; }
      - name: Checkout independent publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout qualified publisher engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: caniko/simit
          ref: ${{ vars.SIMIT_PUBLISHER_REVISION }}
          path: .simit-publisher-engine
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build trusted publisher engine
        working-directory: /
        run: cargo build --release --locked --manifest-path "$GITHUB_WORKSPACE/.simit-publisher-engine/Cargo.toml" --target-dir "$GITHUB_WORKSPACE/.simit-publisher-engine/target"
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Admit signed source and provider-bound archive detritus-protocol
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .simit-publisher-engine/target/release/simit release publisher --publisher-stage prepare --repo "$GITHUB_REPOSITORY" --package detritus-protocol --source-workflow .github/workflows/publish-workspace.yaml --publisher-workflow .github/workflows/trusted-publish-workspace.yaml --reconstruct-package detritus-protocol --reconstruct-package detritus-server --reconstruct-package detritus-client --publisher-output "$RUNNER_TEMP/verified-detritus-protocol" > "$RUNNER_TEMP/verified-detritus-protocol.json"
      - name: Checkout original signed source for verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: .simit-release-source
          persist-credentials: false
      - name: Verify packaged contents detritus-protocol
        working-directory: .simit-release-source
        env:
          NIX_CONFIG: "experimental-features = nix-command flakes"
          XDG_CACHE_HOME: "/tmp/.cache"
          CARGO_HOME: "/tmp/.cargo"
          CARGO_BUILD_JOBS: "4"
          RUSTDOCFLAGS: "-D warnings"
        run: nix develop -c cargo publish --dry-run --locked --manifest-path "$RUNNER_TEMP/verified-detritus-protocol/Cargo.toml"
      - name: Required gate coverage
        timeout-minutes: 60
        working-directory: .simit-release-source
        env:
          NIX_CONFIG: "experimental-features = nix-command flakes"
          XDG_CACHE_HOME: "/tmp/.cache"
          CARGO_HOME: "/tmp/.cargo"
          CARGO_BUILD_JOBS: "4"
          RUSTDOCFLAGS: "-D warnings"
        run: nix develop -c bash scripts/coverage.sh
  publish-detritus-protocol:
    needs: [verify-detritus-protocol]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: simit-crates-io
    steps:
      - name: Require independently qualified publisher engine
        env:
          PUBLISHER_REVISION: ${{ vars.SIMIT_PUBLISHER_REVISION }}
        run: |
          set -euo pipefail
          [[ "$PUBLISHER_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Enroll a qualified immutable Simit publisher revision' >&2; exit 1; }
      - name: Checkout independent publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout qualified publisher engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: caniko/simit
          ref: ${{ vars.SIMIT_PUBLISHER_REVISION }}
          path: .simit-publisher-engine
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build trusted publisher engine
        working-directory: /
        run: cargo build --release --locked --manifest-path "$GITHUB_WORKSPACE/.simit-publisher-engine/Cargo.toml" --target-dir "$GITHUB_WORKSPACE/.simit-publisher-engine/target"
      - name: Upload independently verified archive detritus-protocol
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: .simit-publisher-engine/target/release/simit release publisher --publisher-stage publish --repo "$GITHUB_REPOSITORY" --package detritus-protocol --source-workflow .github/workflows/publish-workspace.yaml --publisher-workflow .github/workflows/trusted-publish-workspace.yaml --reconstruct-package detritus-protocol --reconstruct-package detritus-server --reconstruct-package detritus-client
  verify-detritus-server:
