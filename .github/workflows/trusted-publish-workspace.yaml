          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Admit signed source and provider-bound archive detritus-server
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .simit-publisher-engine/target/release/simit release publisher --publisher-stage prepare --repo "$GITHUB_REPOSITORY" --package detritus-server --source-workflow .github/workflows/publish-workspace.yaml --publisher-workflow .github/workflows/trusted-publish-workspace.yaml --reconstruct-package detritus-protocol --reconstruct-package detritus-server --reconstruct-package detritus-client --publisher-output "$RUNNER_TEMP/verified-detritus-server" > "$RUNNER_TEMP/verified-detritus-server.json"
      - name: Checkout original signed source for verification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: .simit-release-source
          persist-credentials: false
      - name: Verify packaged contents detritus-server
        working-directory: .simit-release-source
        env:
          NIX_CONFIG: "experimental-features = nix-command flakes"
          XDG_CACHE_HOME: "/tmp/.cache"
          CARGO_HOME: "/tmp/.cargo"
          CARGO_BUILD_JOBS: "4"
          RUSTDOCFLAGS: "-D warnings"
        run: nix develop -c cargo publish --dry-run --locked --manifest-path "$RUNNER_TEMP/verified-detritus-server/Cargo.toml"
  publish-detritus-server:
    needs: [verify-detritus-server]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: simit-crates-io
    steps:
      - name: Require independently qualified publisher engine
        env:
          PUBLISHER_REVISION: ${{ vars.SIMIT_PUBLISHER_REVISION }}
        run: |
          set -euo pipefail
          [[ "$PUBLISHER_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Enroll a qualified immutable Simit publisher revision' >&2; exit 1; }
      - name: Checkout independent publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
