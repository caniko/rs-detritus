# Generated by simit. Manual edits will be reported as ci=drift.
# Credential-free signed-tag build. Rerun the original signed-tag run for recovery.
name: Build Workspace Crates

# GitHub crates.io publishers run only on signed semver tag pushes. Retry the original run rather than dispatching a branch.
on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
      CARGO_BUILD_JOBS: "4"
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Validate signed release tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${CODEBERG_REF_NAME:-}}}"
          if [ -z "$tag" ]; then
            ref="${GITHUB_REF:-${FORGE_REF:-${CODEBERG_REF:-}}}"
            tag="${ref#refs/tags/}"
          fi

          if ! printf '%s\n' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must be an exact semver version like 0.1.1, got '$tag'" >&2
            exit 1
          fi
          if ! command -v gpg >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y --no-install-recommends gnupg
            else
              echo "gpg is required to verify signed release tags" >&2
              exit 1
            fi
          fi
          git_fetch() {
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
              git -c "http.extraHeader=$auth_header" fetch "$@"
            else
              git fetch "$@"
            fi
          }
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          # The release checkout cannot supply its own verification key.
          # Fetch the repository's independently maintained default-branch key.
          git_fetch --no-tags origin HEAD
          git show "FETCH_HEAD:keys/maintainers.gpg" > "$GNUPGHOME/maintainers.gpg"
          test -s "$GNUPGHOME/maintainers.gpg"
          gpg --batch --import "$GNUPGHOME/maintainers.gpg"

          git_fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          git verify-tag "$tag"
          signed_tag_name="$(git cat-file tag "refs/tags/$tag" | sed -n '1,/^$/s/^tag //p')"
          test "$signed_tag_name" = "$tag" || { echo 'Signed tag object name differs from the release label' >&2; exit 1; }
          validated_sha="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          checkout_sha="$(git rev-parse --verify HEAD)"
          if [ "$validated_sha" != "$checkout_sha" ]; then
            echo "Signed tag commit does not match the checkout being published" >&2
            exit 1
          fi

      - name: Check cargo-audit tool
        run: nix develop -c cargo-audit --version

      - name: Check cargo-deny tool
        run: nix develop -c cargo-deny --version

      - name: Fetch RustSec advisory database
        run: |
          db="${CARGO_HOME:-$HOME/.cargo}/advisory-db"
          rm -rf "$db"
          mkdir -p "$(dirname "$db")"
          git -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=30 clone --depth 1 https://github.com/RustSec/advisory-db.git "$db"

      - name: Audit dependencies
        run: |
          db="${CARGO_HOME:-$HOME/.cargo}/advisory-db"
          nix develop -c cargo audit --db "$db" --no-fetch --stale

      - name: Deny dependency policy
        run: nix develop -c cargo deny check bans licenses sources

      - name: Test detritus-protocol
        run: nix develop -c cargo test --locked -p detritus-protocol --all-targets --all-features
      - name: Clippy detritus-protocol
        run: nix develop -c cargo clippy --locked -p detritus-protocol --all-targets --all-features -- -D warnings
      - name: Document detritus-protocol
        run: nix develop -c cargo doc --locked -p detritus-protocol --no-deps --all-features
      - name: Test detritus-server
        run: nix develop -c cargo test --locked -p detritus-server --all-targets --all-features
      - name: Clippy detritus-server
        run: nix develop -c cargo clippy --locked -p detritus-server --all-targets --all-features -- -D warnings
      - name: Document detritus-server
        run: nix develop -c cargo doc --locked -p detritus-server --no-deps --all-features
      - name: Test detritus-client
        run: nix develop -c cargo test --locked -p detritus-client --all-targets --all-features
      - name: Clippy detritus-client
        run: nix develop -c cargo clippy --locked -p detritus-client --all-targets --all-features -- -D warnings
      - name: Document detritus-client
        run: nix develop -c cargo doc --locked -p detritus-client --no-deps --all-features
      - name: Verify and package coordinated release set
        run: |
          set -euo pipefail
          nix develop -c cargo --version | awk '{split($2, v, "."); exit !(v[1] > 1 || v[2] >= 89)}' || { echo 'Verifying a coordinated release set needs cargo >= 1.89 (temporary local registry overlay); pin a newer toolchain' >&2; exit 1; }
          nix develop -c cargo package --locked --allow-dirty -p detritus-protocol -p detritus-server -p detritus-client --target-dir "$RUNNER_TEMP/simit-package-target"
      - name: Build immutable archive detritus-protocol
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(nix develop -c cargo pkgid --locked -p detritus-protocol | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/detritus-protocol"
          cp "$RUNNER_TEMP/simit-package-target/package/detritus-protocol-$version.crate" "$RUNNER_TEMP/simit-crates/detritus-protocol/"
          size="$(wc -c < "$RUNNER_TEMP/simit-crates/detritus-protocol/detritus-protocol-$version.crate")"
          test "$size" -le 10485760 || { echo "crate detritus-protocol archive is $size bytes, over the crates.io upload limit of 10485760 bytes (10 MiB)" >&2; exit 1; }
      - name: Retain original-run archive detritus-protocol
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simit-crate-detritus-protocol-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simit-crates/detritus-protocol/*.crate
          if-no-files-found: error
          retention-days: 30

      - name: Build immutable archive detritus-server
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(nix develop -c cargo pkgid --locked -p detritus-server | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/detritus-server"
          cp "$RUNNER_TEMP/simit-package-target/package/detritus-server-$version.crate" "$RUNNER_TEMP/simit-crates/detritus-server/"
          size="$(wc -c < "$RUNNER_TEMP/simit-crates/detritus-server/detritus-server-$version.crate")"
          test "$size" -le 10485760 || { echo "crate detritus-server archive is $size bytes, over the crates.io upload limit of 10485760 bytes (10 MiB)" >&2; exit 1; }
      - name: Retain original-run archive detritus-server
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simit-crate-detritus-server-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simit-crates/detritus-server/*.crate
          if-no-files-found: error
          retention-days: 30

      - name: Build immutable archive detritus-client
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(nix develop -c cargo pkgid --locked -p detritus-client | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/detritus-client"
          cp "$RUNNER_TEMP/simit-package-target/package/detritus-client-$version.crate" "$RUNNER_TEMP/simit-crates/detritus-client/"
          size="$(wc -c < "$RUNNER_TEMP/simit-crates/detritus-client/detritus-client-$version.crate")"
          test "$size" -le 10485760 || { echo "crate detritus-client archive is $size bytes, over the crates.io upload limit of 10485760 bytes (10 MiB)" >&2; exit 1; }
      - name: Retain original-run archive detritus-client
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simit-crate-detritus-client-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simit-crates/detritus-client/*.crate
          if-no-files-found: error
          retention-days: 30
