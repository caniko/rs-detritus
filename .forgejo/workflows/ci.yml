name: ci

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: atlas
    container: rust:bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: rustup component add rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: atlas
    container: rust:bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  check:
    runs-on: atlas
    container: rust:bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: cargo check --workspace --all-features

  test:
    runs-on: atlas
    container: rust:bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: cargo test --workspace --all-features

  doc:
    runs-on: atlas
    container: rust:bookworm
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: cargo doc --workspace --no-deps --all-features

  msrv:
    runs-on: atlas
    container: rust:1.88-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: cargo check --workspace --all-features

  publish-dry-run:
    runs-on: atlas
    container: rust:bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      # Only detritus-protocol is dry-run-able on PR/push: the dependent
      # crates carry `detritus-protocol = "X.Y.Z"` version constraints,
      # which cargo resolves against the live crates.io index. Until
      # X.Y.Z is actually published (which only happens on tag, in the
      # release workflow), dry-runs for detritus-client and
      # detritus-server both fail with "no matching package".
      # The real `cargo publish` of those two runs in release.yml after
      # detritus-protocol@X.Y.Z is visible on the sparse index.
      - run: cargo publish --dry-run -p detritus-protocol --allow-dirty

  audit:
    runs-on: atlas
    container: rust:bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: cargo install --locked cargo-audit
      - run: cargo audit --deny warnings

  deny:
    runs-on: atlas
    container: rust:bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: cargo install --locked cargo-deny
      - run: cargo deny --all-features check
